<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>配件库管理 - 报价单管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
        }
        .table-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .btn-action {
            padding: 5px 10px;
            margin: 2px;
            border-radius: 5px;
        }
        .modal-header {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }
        .page-header {
            background: linear-gradient(135deg, #16a085 0%, #27ae60 100%);
            color: white;
            padding: 40px 0;
        }
        .price-display {
            font-weight: bold;
            color: #16a085;
        }
        .category-badge {
            background: #16a085;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
        }
        .accessory-image {
            width: 50px;
            height: 50px;
            border-radius: 4px;
            object-fit: cover;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body class="bg-light">
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-calculator me-2"></i>报价单管理系统
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            <i class="fas fa-home me-1"></i>首页
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/customers">
                            <i class="fas fa-users me-1"></i>客户管理
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/materials">
                            <i class="fas fa-boxes me-1"></i>材料库
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/processes">
                            <i class="fas fa-cogs me-1"></i>工艺库
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/quotations">
                            <i class="fas fa-file-invoice-dollar me-1"></i>报价单
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 页面标题 -->
    <div class="page-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <h1><i class="fas fa-puzzle-piece me-3"></i>配件库管理</h1>
                    <p class="mb-0">管理报价单中的配件信息，包括螺丝、胶水、五金件等辅助材料</p>
                </div>
                <div class="col-md-4 text-end">
                    <span class="category-badge">05 配件</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 主要内容 -->
    <div class="container my-4">
        <!-- 操作按钮 -->
        <div class="row mb-4">
            <div class="col-md-6">
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#accessoryModal" onclick="openAddModal()">
                    <i class="fas fa-plus me-2"></i>添加配件
                </button>
                <button class="btn btn-outline-secondary ms-2" onclick="loadAccessories()">
                    <i class="fas fa-sync-alt me-1"></i>刷新
                </button>
            </div>
            <div class="col-md-6">
                <div class="input-group">
                    <input type="text" class="form-control" id="searchInput" placeholder="搜索配件名称或类型...">
                    <button class="btn btn-outline-secondary" type="button" onclick="searchAccessories()">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- 配件列表 -->
        <div class="table-container">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>图片</th>
                            <th>配件名称</th>
                            <th>配件类型</th>
                            <th>规格型号</th>
                            <th>单位</th>
                            <th>单价</th>
                            <th>库存</th>
                            <th>供应商</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="accessoryTableBody">
                        <tr>
                            <td colspan="10" class="text-center text-muted py-4">
                                <i class="fas fa-spinner fa-spin fa-2x mb-2"></i><br>
                                正在加载配件数据...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 空状态提示 -->
        <div id="emptyState" class="text-center py-5" style="display: none;">
            <i class="fas fa-puzzle-piece fa-5x text-muted mb-3"></i>
            <h4 class="text-muted">暂无配件数据</h4>
            <p class="text-muted">点击上方"添加配件"按钮开始添加配件信息</p>
        </div>
    </div>

    <!-- 配件信息模态框 -->
    <div class="modal fade" id="accessoryModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">
                        <i class="fas fa-puzzle-piece me-2"></i>添加配件
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="accessoryForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="accessoryName" class="form-label">配件名称 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="accessoryName" required placeholder="如：不锈钢螺丝、结构胶等">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="accessoryType" class="form-label">配件类型</label>
                                <select class="form-select" id="accessoryType">
                                    <option value="">请选择配件类型</option>
                                    <option value="紧固件">紧固件</option>
                                    <option value="胶水类">胶水类</option>
                                    <option value="五金件">五金件</option>
                                    <option value="电子元件">电子元件</option>
                                    <option value="密封件">密封件</option>
                                    <option value="连接件">连接件</option>
                                    <option value="装饰件">装饰件</option>
                                    <option value="其他">其他</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="accessorySpecification" class="form-label">规格型号</label>
                                <input type="text" class="form-control" id="accessorySpecification" placeholder="如：M6×20、φ8×50等">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="accessoryBrand" class="form-label">品牌</label>
                                <input type="text" class="form-control" id="accessoryBrand" placeholder="配件品牌">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="accessoryUnit" class="form-label">单位</label>
                                <select class="form-select" id="accessoryUnit">
                                    <option value="">请选择单位</option>
                                    <option value="个">个</option>
                                    <option value="套">套</option>
                                    <option value="包">包</option>
                                    <option value="盒">盒</option>
                                    <option value="瓶">瓶</option>
                                    <option value="支">支</option>
                                    <option value="米">米</option>
                                    <option value="公斤">公斤</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="accessoryPrice" class="form-label">单价 (元)</label>
                                <input type="number" class="form-control" id="accessoryPrice" step="0.01" min="0" placeholder="0.00">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="stockQuantity" class="form-label">库存数量</label>
                                <input type="number" class="form-control" id="stockQuantity" step="1" min="0" placeholder="0">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="accessorySupplier" class="form-label">供应商</label>
                                <input type="text" class="form-control" id="accessorySupplier" placeholder="供应商名称">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="supplierContact" class="form-label">供应商联系方式</label>
                                <input type="text" class="form-control" id="supplierContact" placeholder="电话或邮箱">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="materialType" class="form-label">材质</label>
                                <select class="form-select" id="materialType">
                                    <option value="">请选择材质</option>
                                    <option value="不锈钢">不锈钢</option>
                                    <option value="碳钢">碳钢</option>
                                    <option value="铝合金">铝合金</option>
                                    <option value="塑料">塑料</option>
                                    <option value="橡胶">橡胶</option>
                                    <option value="铜">铜</option>
                                    <option value="其他">其他</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="minOrderQuantity" class="form-label">最小起订量</label>
                                <input type="number" class="form-control" id="minOrderQuantity" step="1" min="1" placeholder="1">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="leadTime" class="form-label">交货周期 (天)</label>
                                <input type="number" class="form-control" id="leadTime" step="1" min="0" placeholder="1">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="storageCondition" class="form-label">存储条件</label>
                                <select class="form-select" id="storageCondition">
                                    <option value="">请选择存储条件</option>
                                    <option value="常温">常温</option>
                                    <option value="干燥">干燥</option>
                                    <option value="防潮">防潮</option>
                                    <option value="避光">避光</option>
                                    <option value="低温">低温</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="shelfLife" class="form-label">保质期 (月)</label>
                                <input type="number" class="form-control" id="shelfLife" step="1" min="0" placeholder="12">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="accessoryDescription" class="form-label">备注说明</label>
                            <textarea class="form-control" id="accessoryDescription" rows="3" placeholder="可填写配件的详细描述、使用说明、注意事项等信息"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times me-1"></i>取消
                    </button>
                    <button type="button" class="btn btn-success" onclick="saveAccessory()">
                        <i class="fas fa-save me-1"></i>保存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 删除确认模态框 -->
    <div class="modal fade" id="deleteAccessoryModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">
                        <i class="fas fa-exclamation-triangle me-2"></i>确认删除
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>确定要删除配件 "<span id="deleteAccessoryName"></span>" 吗？</p>
                    <p class="text-muted small">此操作不可撤销，请谨慎操作。</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-danger" onclick="confirmDeleteAccessory()">删除</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let accessories = [];
        let currentAccessoryId = null;
        let isEditMode = false;

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadAccessories();
        });

        // 加载配件数据
        function loadAccessories() {
            fetch('/api/accessories')
            .then(response => response.json())
            .then(data => {
                accessories = data;
                displayAccessories(data);
            })
            .catch(error => {
                console.error('Error loading accessories:', error);
                showAlert('加载配件数据失败', 'danger');
            });
        }

        // 显示配件列表
        function displayAccessories(accessoriesData) {
            const tbody = document.getElementById('accessoryTableBody');
            const emptyState = document.getElementById('emptyState');
            
            if (accessoriesData.length === 0) {
                tbody.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';
            tbody.innerHTML = accessoriesData.map(accessory => `
                <tr>
                    <td>${accessory.id}</td>
                    <td>
                        <div class="accessory-image bg-light d-flex align-items-center justify-content-center">
                            <i class="fas fa-puzzle-piece text-muted"></i>
                        </div>
                    </td>
                    <td><strong>${accessory.name}</strong></td>
                    <td><span class="badge bg-info">${accessory.type || '-'}</span></td>
                    <td>${accessory.specification || '-'}</td>
                    <td>${accessory.unit || '-'}</td>
                    <td class="price-display">¥${(accessory.price || 0).toFixed(2)}</td>
                    <td><span class="badge ${getStockClass(accessory.stock_quantity)}">${accessory.stock_quantity || 0}</span></td>
                    <td>${accessory.supplier || '-'}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary btn-action" onclick="editAccessory(${accessory.id})" title="编辑">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger btn-action" onclick="deleteAccessory(${accessory.id}, '${accessory.name}')" title="删除">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // 获取库存状态样式
        function getStockClass(quantity) {
            if (quantity > 50) return 'bg-success';
            if (quantity > 10) return 'bg-warning';
            return 'bg-danger';
        }

        // 搜索配件
        function searchAccessories() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filteredAccessories = accessories.filter(accessory => 
                accessory.name.toLowerCase().includes(searchTerm) ||
                (accessory.type && accessory.type.toLowerCase().includes(searchTerm))
            );
            displayAccessories(filteredAccessories);
        }

        // 打开添加模态框
        function openAddModal() {
            isEditMode = false;
            currentAccessoryId = null;
            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-plus me-2"></i>添加配件';
            document.getElementById('accessoryForm').reset();
        }

        // 编辑配件
        function editAccessory(id) {
            const accessory = accessories.find(a => a.id === id);
            if (!accessory) return;
            
            isEditMode = true;
            currentAccessoryId = id;
            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-edit me-2"></i>编辑配件';
            
            // 填充表单数据
            document.getElementById('accessoryName').value = accessory.name || '';
            document.getElementById('accessoryType').value = accessory.type || '';
            document.getElementById('accessorySpecification').value = accessory.specification || '';
            document.getElementById('accessoryBrand').value = accessory.brand || '';
            document.getElementById('accessoryUnit').value = accessory.unit || '';
            document.getElementById('accessoryPrice').value = accessory.price || '';
            document.getElementById('stockQuantity').value = accessory.stock_quantity || '';
            document.getElementById('accessorySupplier').value = accessory.supplier || '';
            document.getElementById('supplierContact').value = accessory.supplier_contact || '';
            document.getElementById('materialType').value = accessory.material_type || '';
            document.getElementById('minOrderQuantity').value = accessory.min_order_quantity || '';
            document.getElementById('leadTime').value = accessory.lead_time || '';
            document.getElementById('storageCondition').value = accessory.storage_condition || '';
            document.getElementById('shelfLife').value = accessory.shelf_life || '';
            document.getElementById('accessoryDescription').value = accessory.description || '';
            
            new bootstrap.Modal(document.getElementById('accessoryModal')).show();
        }

        // 保存配件
        function saveAccessory() {
            const form = document.getElementById('accessoryForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }
            
            const accessoryData = {
                name: document.getElementById('accessoryName').value,
                type: document.getElementById('accessoryType').value,
                specification: document.getElementById('accessorySpecification').value,
                brand: document.getElementById('accessoryBrand').value,
                unit: document.getElementById('accessoryUnit').value,
                price: parseFloat(document.getElementById('accessoryPrice').value) || 0,
                stock_quantity: parseInt(document.getElementById('stockQuantity').value) || 0,
                supplier: document.getElementById('accessorySupplier').value,
                supplier_contact: document.getElementById('supplierContact').value,
                material_type: document.getElementById('materialType').value,
                min_order_quantity: parseInt(document.getElementById('minOrderQuantity').value) || 1,
                lead_time: parseInt(document.getElementById('leadTime').value) || 0,
                storage_condition: document.getElementById('storageCondition').value,
                shelf_life: parseInt(document.getElementById('shelfLife').value) || 0,
                description: document.getElementById('accessoryDescription').value,
                category: '05'
            };
            
            const url = isEditMode ? `/api/accessories/${currentAccessoryId}` : '/api/accessories';
            const method = isEditMode ? 'PUT' : 'POST';
            
            fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(accessoryData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    bootstrap.Modal.getInstance(document.getElementById('accessoryModal')).hide();
                    loadAccessories();
                    showAlert(isEditMode ? '配件更新成功' : '配件添加成功', 'success');
                } else {
                    showAlert('操作失败：' + data.message, 'danger');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showAlert('操作失败，请重试', 'danger');
            });
        }

        // 删除配件
        function deleteAccessory(id, name) {
            currentAccessoryId = id;
            document.getElementById('deleteAccessoryName').textContent = name;
            new bootstrap.Modal(document.getElementById('deleteAccessoryModal')).show();
        }

        // 确认删除配件
        function confirmDeleteAccessory() {
            fetch(`/api/accessories/${currentAccessoryId}`, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    bootstrap.Modal.getInstance(document.getElementById('deleteAccessoryModal')).hide();
                    loadAccessories();
                    showAlert('配件删除成功', 'success');
                } else {
                    showAlert('删除失败：' + data.message, 'danger');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showAlert('删除失败，请重试', 'danger');
            });
        }

        // 显示提示信息
        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} alert-dismissible fade show position-fixed`;
            alertDiv.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px;';
            alertDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            document.body.appendChild(alertDiv);
            
            setTimeout(() => {
                if (alertDiv.parentNode) {
                    alertDiv.parentNode.removeChild(alertDiv);
                }
            }, 5000);
        }

        // 搜索框回车事件
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchAccessories();
            }
        });
    </script>
</body>
</html>
