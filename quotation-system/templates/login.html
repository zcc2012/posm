<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 报价单管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --app-bg: #f4f6f8;
            --surface: #ffffff;
            --line: #d9dee7;
            --text: #1f2937;
            --muted: #64748b;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
        }

        body {
            align-items: center;
            background: var(--app-bg);
            color: var(--text);
            display: flex;
            font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
            min-height: 100vh;
        }

        .login-panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            margin: 0 auto;
            max-width: 420px;
            padding: 28px;
            width: calc(100% - 32px);
        }

        .login-panel h1 {
            font-size: 1.45rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .login-panel p {
            color: var(--muted);
            margin-bottom: 22px;
        }

        .form-control {
            border-radius: 6px;
            min-height: 42px;
        }

        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            border-radius: 6px;
            font-weight: 700;
            min-height: 42px;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
        }
    </style>
</head>
<body>
    <main class="login-panel">
        <h1>报价单管理系统</h1>
        <p>请输入管理员账号和密码。</p>

        {% if not auth_enabled %}
        <div class="alert alert-warning">
            登录保护尚未配置。请先设置 QUOTE_ADMIN_USER 和 QUOTE_ADMIN_PASSWORD 环境变量。
        </div>
        {% else %}
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="post" action="{{ url_for('auth.login') }}">
            <input type="hidden" name="next" value="{{ next_url }}">
            <div class="mb-3">
                <label class="form-label" for="username">账号</label>
                <input class="form-control" id="username" name="username" autocomplete="username" required>
            </div>
            <div class="mb-4">
                <label class="form-label" for="password">密码</label>
                <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">登录</button>
        </form>
        {% endif %}
    </main>
</body>
</html>
