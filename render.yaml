services:
  - type: web
    name: posm-quotation-system
    runtime: python
    plan: free
    region: singapore
    rootDir: 电脑报价系统
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
