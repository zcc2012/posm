<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主材料库管理 - 报价单管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
        }
        .table-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .btn-action {
            padding: 5px 10px;
            margin: 2px;
            border-radius: 5px;
        }
        .modal-header {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }
        .page-header {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            padding: 40px 0;
        }
        .price-display {
            font-weight: bold;
            color: #e74c3c;
        }
        .category-badge {
            background: #e74c3c;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body class="bg-light">
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-calculator me-2"></i>报价单管理系统
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">
                            <i class="fas fa-home me-1"></i>首页
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/customers">
                            <i class="fas fa-users me-1"></i>客户管理
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/materials">
                            <i class="fas fa-boxes me-1"></i>材料库
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/processes">
                            <i class="fas fa-cogs me-1"></i>工艺库
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/quotations">
                            <i class="fas fa-file-invoice-dollar me-1"></i>报价单
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 页面标题 -->
    <div class="page-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <h1><i class="fas fa-layer-group me-3"></i>主材料库管理</h1>
                    <p class="mb-0">管理报价单中的主要材料信息，包括板材、型材、基础材料等</p>
                </div>
                <div class="col-md-4 text-end">
                    <span class="category-badge">01 主材料</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 主要内容 -->
    <div class="container my-4">
        <!-- 操作按钮 -->
        <div class="row mb-4">
            <div class="col-md-6">
                <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#materialModal" onclick="openAddModal()">
                    <i class="fas fa-plus me-2"></i>添加主材料
                </button>
                <button class="btn btn-outline-secondary ms-2" onclick="loadMaterials()">
                    <i class="fas fa-sync-alt me-1"></i>刷新
                </button>
            </div>
            <div class="col-md-6">
                <div class="input-group">
                    <input type="text" class="form-control" id="searchInput" placeholder="搜索主材料名称或规格...">
                    <button class="btn btn-outline-secondary" type="button" onclick="searchMaterials()">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- 材料列表 -->
        <div class="table-container">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>材料名称</th>
                            <th>规格型号</th>
                            <th>材质类型</th>
                            <th>单位</th>
                            <th>基础单价</th>
                            <th>平方单价</th>
                            <th>供应商</th>
                            <th>库存状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="materialTableBody">
                        <tr>
                            <td colspan="10" class="text-center text-muted py-4">
                                <i class="fas fa-spinner fa-spin fa-2x mb-2"></i><br>
                                正在加载主材料数据...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 空状态提示 -->
        <div id="emptyState" class="text-center py-5" style="display: none;">
            <i class="fas fa-layer-group fa-5x text-muted mb-3"></i>
            <h4 class="text-muted">暂无主材料数据</h4>
            <p class="text-muted">点击上方"添加主材料"按钮开始添加材料信息</p>
        </div>
    </div>

    <!-- 主材料信息模态框 -->
    <div class="modal fade" id="materialModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">
                        <i class="fas fa-layer-group me-2"></i>添加主材料
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="materialForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="materialName" class="form-label">材料名称 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="materialName" required placeholder="如：铝塑板、不锈钢板等">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="materialSpecification" class="form-label">规格型号</label>
                                <input type="text" class="form-control" id="materialSpecification" placeholder="如：3mm厚度、1220*2440mm等">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="materialType" class="form-label">材质类型</label>
                                <select class="form-select" id="materialType">
                                    <option value="">请选择材质类型</option>
                                    <option value="金属材料">金属材料</option>
                                    <option value="塑料材料">塑料材料</option>
                                    <option value="复合材料">复合材料</option>
                                    <option value="木质材料">木质材料</option>
                                    <option value="玻璃材料">玻璃材料</option>
                                    <option value="石材">石材</option>
                                    <option value="其他">其他</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="materialUnit" class="form-label">单位</label>
                                <select class="form-select" id="materialUnit">
                                    <option value="">请选择单位</option>
                                    <option value="平方米">平方米</option>
                                    <option value="米">米</option>
                                    <option value="张">张</option>
                                    <option value="块">块</option>
                                    <option value="公斤">公斤</option>
                                    <option value="吨">吨</option>
                                    <option value="套">套</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="stockStatus" class="form-label">库存状态</label>
                                <select class="form-select" id="stockStatus">
                                    <option value="充足">充足</option>
                                    <option value="紧张">紧张</option>
                                    <option value="缺货">缺货</option>
                                    <option value="停产">停产</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="materialUnitPrice" class="form-label">基础单价 (元)</label>
                                <input type="number" class="form-control" id="materialUnitPrice" step="0.01" min="0" placeholder="0.00">
                                <div class="form-text">材料的基础价格</div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="materialSquarePrice" class="form-label">平方单价 (元/㎡)</label>
                                <input type="number" class="form-control" id="materialSquarePrice" step="0.01" min="0" placeholder="0.00">
                                <div class="form-text">按面积计算的单价</div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="materialSupplier" class="form-label">供应商</label>
                                <input type="text" class="form-control" id="materialSupplier" placeholder="供应商名称">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="materialColor" class="form-label">颜色/表面处理</label>
                                <input type="text" class="form-control" id="materialColor" placeholder="如：银白色、拉丝、喷涂等">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="materialThickness" class="form-label">厚度 (mm)</label>
                                <input type="number" class="form-control" id="materialThickness" step="0.1" min="0" placeholder="0.0">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="materialDescription" class="form-label">备注说明</label>
                            <textarea class="form-control" id="materialDescription" rows="3" placeholder="可填写材料的详细描述、技术参数、使用注意事项等信息"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times me-1"></i>取消
                    </button>
                    <button type="button" class="btn btn-danger" onclick="saveMaterial()">
                        <i class="fas fa-save me-1"></i>保存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 删除确认模态框 -->
    <div class="modal fade" id="deleteMaterialModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">
                        <i class="fas fa-exclamation-triangle me-2"></i>确认删除
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>确定要删除主材料 "<span id="deleteMaterialName"></span>" 吗？</p>
                    <p class="text-muted small">此操作不可撤销，请谨慎操作。</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-danger" onclick="confirmDeleteMaterial()">删除</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let materials = [];
        let currentMaterialId = null;
        let isEditMode = false;

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadMaterials();
        });

        // 加载主材料数据
        function loadMaterials() {
            fetch('/api/main_materials')
            .then(response => response.json())
            .then(data => {
                materials = data;
                displayMaterials(data);
            })
            .catch(error => {
                console.error('Error loading materials:', error);
                showAlert('加载主材料数据失败', 'danger');
            });
        }

        // 显示主材料列表
        function displayMaterials(materialsData) {
            const tbody = document.getElementById('materialTableBody');
            const emptyState = document.getElementById('emptyState');
            
            if (materialsData.length === 0) {
                tbody.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';
            tbody.innerHTML = materialsData.map(material => `
                <tr>
                    <td>${material.id}</td>
                    <td><strong>${material.name}</strong></td>
                    <td>${material.specification || '-'}</td>
                    <td><span class="badge bg-secondary">${material.type || '-'}</span></td>
                    <td>${material.unit || '-'}</td>
                    <td class="price-display">¥${(material.unit_price || 0).toFixed(2)}</td>
                    <td class="price-display">¥${(material.square_price || 0).toFixed(2)}</td>
                    <td>${material.supplier || '-'}</td>
                    <td><span class="badge ${getStockStatusClass(material.stock_status)}">${material.stock_status || '未知'}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary btn-action" onclick="editMaterial(${material.id})" title="编辑">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger btn-action" onclick="deleteMaterial(${material.id}, '${material.name}')" title="删除">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // 获取库存状态样式
        function getStockStatusClass(status) {
            switch(status) {
                case '充足': return 'bg-success';
                case '紧张': return 'bg-warning';
                case '缺货': return 'bg-danger';
                case '停产': return 'bg-dark';
                default: return 'bg-secondary';
            }
        }

        // 搜索主材料
        function searchMaterials() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filteredMaterials = materials.filter(material => 
                material.name.toLowerCase().includes(searchTerm) ||
                (material.specification && material.specification.toLowerCase().includes(searchTerm))
            );
            displayMaterials(filteredMaterials);
        }

        // 打开添加模态框
        function openAddModal() {
            isEditMode = false;
            currentMaterialId = null;
            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-plus me-2"></i>添加主材料';
            document.getElementById('materialForm').reset();
            document.getElementById('stockStatus').value = '充足';
        }

        // 编辑主材料
        function editMaterial(id) {
            const material = materials.find(m => m.id === id);
            if (!material) return;
            
            isEditMode = true;
            currentMaterialId = id;
            document.getElementById('modalTitle').innerHTML = '<i class="fas fa-edit me-2"></i>编辑主材料';
            
            // 填充表单数据
            document.getElementById('materialName').value = material.name || '';
            document.getElementById('materialSpecification').value = material.specification || '';
            document.getElementById('materialType').value = material.type || '';
            document.getElementById('materialUnit').value = material.unit || '';
            document.getElementById('stockStatus').value = material.stock_status || '充足';
            document.getElementById('materialUnitPrice').value = material.unit_price || '';
            document.getElementById('materialSquarePrice').value = material.square_price || '';
            document.getElementById('materialSupplier').value = material.supplier || '';
            document.getElementById('materialColor').value = material.color || '';
            document.getElementById('materialThickness').value = material.thickness || '';
            document.getElementById('materialDescription').value = material.description || '';
            
            new bootstrap.Modal(document.getElementById('materialModal')).show();
        }

        // 保存主材料
        function saveMaterial() {
            const form = document.getElementById('materialForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }
            
            const materialData = {
                name: document.getElementById('materialName').value,
                specification: document.getElementById('materialSpecification').value,
                type: document.getElementById('materialType').value,
                unit: document.getElementById('materialUnit').value,
                stock_status: document.getElementById('stockStatus').value,
                unit_price: parseFloat(document.getElementById('materialUnitPrice').value) || 0,
                square_price: parseFloat(document.getElementById('materialSquarePrice').value) || 0,
                supplier: document.getElementById('materialSupplier').value,
                color: document.getElementById('materialColor').value,
                thickness: parseFloat(document.getElementById('materialThickness').value) || 0,
                description: document.getElementById('materialDescription').value,
                category: '01'
            };
            
            const url = isEditMode ? `/api/main_materials/${currentMaterialId}` : '/api/main_materials';
            const method = isEditMode ? 'PUT' : 'POST';
            
            fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(materialData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    bootstrap.Modal.getInstance(document.getElementById('materialModal')).hide();
                    loadMaterials();
                    showAlert(isEditMode ? '主材料更新成功' : '主材料添加成功', 'success');
                } else {
                    showAlert('操作失败：' + data.message, 'danger');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showAlert('操作失败，请重试', 'danger');
            });
        }

        // 删除主材料
        function deleteMaterial(id, name) {
            currentMaterialId = id;
            document.getElementById('deleteMaterialName').textContent = name;
            new bootstrap.Modal(document.getElementById('deleteMaterialModal')).show();
        }

        // 确认删除主材料
        function confirmDeleteMaterial() {
            fetch(`/api/main_materials/${currentMaterialId}`, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    bootstrap.Modal.getInstance(document.getElementById('deleteMaterialModal')).hide();
                    loadMaterials();
                    showAlert('主材料删除成功', 'success');
                } else {
                    showAlert('删除失败：' + data.message, 'danger');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showAlert('删除失败，请重试', 'danger');
            });
        }

        // 显示提示信息
        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} alert-dismissible fade show position-fixed`;
            alertDiv.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px;';
            alertDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            document.body.appendChild(alertDiv);
            
            setTimeout(() => {
                if (alertDiv.parentNode) {
                    alertDiv.parentNode.removeChild(alertDiv);
                }
            }, 5000);
        }

        // 搜索框回车事件
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchMaterials();
            }
        });
    </script>
</body>
</html>
