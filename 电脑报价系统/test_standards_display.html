<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>判定标准信息栏测试</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .standards-info-panel {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border: 2px solid #dee2e6;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .standards-info-header {
            font-weight: bold;
            color: #495057;
            margin-bottom: 15px;
            font-size: 16px;
        }
        .standard-item {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #007bff;
        }
        .standard-name {
            font-weight: bold;
            color: #007bff;
            margin-bottom: 8px;
        }
        .standard-details {
            margin: 5px 0;
            color: #6c757d;
        }
        .calculation {
            background: #f8f9fa;
            padding: 5px 10px;
            border-radius: 4px;
            font-family: monospace;
            color: #495057;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h2>判定标准信息栏测试</h2>
        
        <div class="row">
            <div class="col-md-6">
                <h4>测试表单</h4>
                <div class="mb-3">
                    <label>材料:</label>
                    <select id="materialSelect" class="form-select">
                        <option value="">请选择材料</option>
                        <option value="1" data-unit-price="10" data-square-price="5">测试材料1</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label>工艺:</label>
                    <select id="processSelect" class="form-select">
                        <option value="">请选择工艺</option>
                        <option value="1" data-price="100">印刷</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label>长度(mm):</label>
                    <input type="number" id="lengthInput" class="form-control" value="500">
                </div>
                <div class="mb-3">
                    <label>宽度(mm):</label>
                    <input type="number" id="widthInput" class="form-control" value="300">
                </div>
                <div class="mb-3">
                    <label>数量:</label>
                    <input type="number" id="quantityInput" class="form-control" value="1000">
                </div>
                <div class="mb-3">
                    <label>项目套数:</label>
                    <input type="number" id="projectSets" class="form-control" value="1">
                </div>
                <button onclick="testStandardsDisplay()" class="btn btn-primary">测试显示</button>
            </div>
            
            <div class="col-md-6">
                <h4>判定标准信息栏</h4>
                <div class="standards-info-panel" id="standardsInfoPanel">
                    <div class="standards-info-header">
                        <i class="fas fa-info-circle me-2"></i>当前使用的判定标准
                    </div>
                    <div class="standards-info-content" id="standardsInfoContent">
                        <div class="text-muted">暂无匹配标准</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 模拟判定标准数据
        function createTestStandard() {
            const length = parseFloat(document.getElementById('lengthInput').value) || 0;
            const width = parseFloat(document.getElementById('widthInput').value) || 0;
            const quantity = parseFloat(document.getElementById('quantityInput').value) || 1;
            const projectSets = parseInt(document.getElementById('projectSets').value) || 1;
            const totalQuantity = quantity * projectSets;
            
            return {
                type: 'default_printing',
                name: '4开印刷',
                base_price: 1000,
                square_price: 0.15,
                quantity_range: `总数量: ${totalQuantity}件 (≤3000件)`
            };
        }
        
        // 更新判定标准信息栏
        function updateStandardsInfoPanel(standards) {
            console.log('📊 更新判定标准信息栏:', standards);
            const contentDiv = document.getElementById('standardsInfoContent');
            if (!contentDiv) {
                console.error('❌ 找不到判定标准信息栏容器');
                return;
            }
            
            if (!standards || standards.length === 0) {
                contentDiv.innerHTML = '<div class="text-muted">暂无匹配标准</div>';
                return;
            }
            
            // 获取当前输入数据
            const currentLength = parseFloat(document.getElementById('lengthInput').value) || 0;
            const currentWidth = parseFloat(document.getElementById('widthInput').value) || 0;
            const currentQuantity = parseFloat(document.getElementById('quantityInput').value) || 1;
            const projectSets = parseInt(document.getElementById('projectSets').value) || 1;
            const totalQuantity = currentQuantity * projectSets;
            
            let content = '';
            standards.forEach(standard => {
                let itemContent = `<div class="standard-item">`;
                
                if (standard.type === 'default_printing') {
                    // 默认印刷计算（≤3000件）
                    itemContent += `<div class="standard-name">🖨️ ${standard.name}</div>`;
                    
                    // 显示数量区间
                    if (standard.quantity_range) {
                        itemContent += `<div class="standard-details quantity-range">📊 数量区间: ${standard.quantity_range}</div>`;
                    }
                    
                    itemContent += `<div class="standard-details">💰 基础价格: ¥${standard.base_price}</div>`;
                    
                    // 显示计算过程
                    if (currentLength > 0 && currentWidth > 0) {
                        const area = (currentLength + 30) * (currentWidth + 30) / 1000000;
                        itemContent += `<div class="standard-details calculation">📐 面积计算: (${currentLength}+30)×(${currentWidth}+30)÷1000000 = ${area.toFixed(4)}m²</div>`;
                        itemContent += `<div class="standard-details calculation">📊 数量计算: ${currentQuantity}×${projectSets} = ${totalQuantity}件</div>`;
                        const unitCost = standard.base_price / totalQuantity;
                        itemContent += `<div class="standard-details calculation">💰 单价计算: ¥${standard.base_price}÷${totalQuantity} = ¥${unitCost.toFixed(4)}</div>`;
                    }
                }
                
                itemContent += '</div>';
                content += itemContent;
            });
            
            contentDiv.innerHTML = content;
            console.log('✅ 判定标准信息栏更新完成');
        }
        
        // 测试显示功能
        function testStandardsDisplay() {
            console.log('🧪 开始测试判定标准显示...');
            const testStandard = createTestStandard();
            console.log('📋 测试标准数据:', testStandard);
            updateStandardsInfoPanel([testStandard]);
        }
        
        // 页面加载完成后自动测试
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📄 页面加载完成，开始自动测试...');
            // 选择默认值
            document.getElementById('materialSelect').value = '1';
            document.getElementById('processSelect').value = '1';
            // 自动测试显示
            setTimeout(testStandardsDisplay, 500);
        });
    </script>
</body>
</html>
